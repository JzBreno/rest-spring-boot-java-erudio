<section class="panel">
  <header class="page-header"><h2>PC</h2><p>Base: <code>/pc</code></p></header>
  <div class="card">
    <app-panel-tabs [tabs]="tabs" [activeId]="activeTab" (tabChange)="onTab($event)" />
    @if (activeTab === 'listar') {
      <button type="button" class="btn-primary" (click)="listar()" [disabled]="loading">GET /findAll</button>
    }
    @if (activeTab === 'buscar') {
      <form class="inline-form" [formGroup]="idForm" (ngSubmit)="buscar()">
        <label>ID <input type="number" formControlName="id" /></label>
        <button type="submit" class="btn-primary">GET /:id</button>
      </form>
    }
    @if (activeTab === 'criar' || activeTab === 'atualizar') {
      @if (activeTab === 'atualizar') {
        <form class="inline-form" [formGroup]="idForm" (ngSubmit)="carregar()" style="margin-bottom:1rem">
          <label>ID <input type="number" formControlName="id" /></label>
          <button type="submit" class="btn-secondary">Carregar</button>
        </form>
      }
      <form class="form-grid" [formGroup]="pcForm" (ngSubmit)="activeTab === 'criar' ? criar() : atualizar()">
        <label>ID <input type="number" formControlName="id" /></label>
        <label>Placa de vídeo <input formControlName="video_card" /></label>
        <label>CPU <input formControlName="cpu" /></label>
        <label>RAM <input formControlName="ramMemory" /></label>
        <label>Armazenamento <input formControlName="storage_unit" /></label>
        <button type="submit" class="btn-primary" [disabled]="loading">Executar</button>
      </form>
    }
    @if (activeTab === 'excluir') {
      <form class="inline-form" [formGroup]="idForm" (ngSubmit)="excluir()">
        <label>ID <input type="number" formControlName="id" /></label>
        <button type="submit" class="btn-danger">DELETE /:id</button>
      </form>
    }
    <app-response-box [loading]="loading" [error]="error" [success]="success" [data]="data" />
  </div>
</section>
